[package]
name = "safu-signer"
version = "0.1.0"
edition = "2021"
description = "Server-side signing module for safu — key unwrap and NEAR transaction signing"

[lib]
crate-type = ["cdylib", "rlib"]
# cdylib  → wasm-pack WASM output
# rlib    → native Rust tests and future native binary use

[dependencies]
# WASM bindings
wasm-bindgen = "0.2"

# Crypto — key unwrap
aes-gcm    = "0.10"
pbkdf2     = "0.12"          # default features include hmac
sha2       = "0.10"
rsa        = { version = "0.9", features = ["pem"] }
                             # "pem" enables pkcs8/pem + pkcs1/pem parsing

# Crypto — signing
ed25519-dalek = { version = "2", features = ["zeroize"] }
                             # zeroize feature: ZeroizeOnDrop on SigningKey

# Key encoding
bs58       = "0.5"
base64     = "0.21"

# Memory safety — deterministic zeroing of sensitive buffers
zeroize    = { version = "1", features = ["derive"] }

# Serialization (wrap_params JSON)
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# WASM entropy source
getrandom  = { version = "0.2", features = ["js"] }

[dev-dependencies]
# Used in unit tests to encrypt test vectors that match the TypeScript scheme
aes-gcm    = "0.10"
pbkdf2     = "0.12"
sha2       = "0.10"
rsa        = { version = "0.9", features = ["pem"] }
proptest   = "1"

[profile.release]
opt-level = "z"   # minimise WASM binary size
lto       = true
