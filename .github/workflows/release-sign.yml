name: Release and Sigstore Sign

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (example: v1.0.0)'
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate OSS manifest and digest
        run: ./scripts/generate-oss-manifest.sh

      - name: Build release tarball
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          ARCHIVE="core-security-${TAG}.tar.gz"
          git ls-files -z | tar --null -T - -czf "$ARCHIVE"
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.8.2

      - name: Keyless sign archive
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          ARCHIVE="core-security-${TAG}.tar.gz"
          cosign sign-blob --yes \
            --output-signature "$ARCHIVE.sig" \
            --output-certificate "$ARCHIVE.pem" \
            "$ARCHIVE"

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: |
            core-security-${{ steps.meta.outputs.tag }}.tar.gz
            core-security-${{ steps.meta.outputs.tag }}.tar.gz.sha256
            core-security-${{ steps.meta.outputs.tag }}.tar.gz.sig
            core-security-${{ steps.meta.outputs.tag }}.tar.gz.pem
