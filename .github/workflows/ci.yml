name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  digest-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate OSS manifest and digest
        run: ./scripts/generate-oss-manifest.sh

      - name: Verify committed digest files are current
        run: |
          git diff --exit-code .oss-manifest.txt .oss-digest.txt || {
            echo "Manifest/digest are out of date. Run ./scripts/generate-oss-manifest.sh and commit.";
            exit 1;
          }
